# The recycle bin (ADR-035): a deleted cloud backup waits 30 days, then it is
# erased for good; it can be restored or deleted permanently before then.
# One [[scenario]] per check; ids are R<group>.<n>, stable and never reused.
# Retire a scenario with status = "retired" and a `note`; never delete it.
# Add one by taking the next number in its group and raising that group in
# [issued]. Field reference: qa/SCHEMA.md. The manual pass is
# docs/app/WORKFLOWS.md §3.13-3.14, §4.15-4.19 and §4.2.

schema = 1
id = "recycle-bin"
title = "Recycle bin: a deleted cloud backup kept 30 days, restored or deleted permanently"
prefix = "R"
since = "ADR-035"
note = "Needs the ADR-035 backend on staging, which is the owner's deploy (gate `deploy`). Production waits for counsel's Privacy Policy release (TD-277); run this suite on staging only."

# The highest number ever issued in each group. Every id up to it must still
# be in this file (retired or not); a new id raises it by one.
[issued]
R1 = 7
R2 = 4
R3 = 4
R4 = 3
R5 = 3
R6 = 4

# ===========================================================================
# R1 Deleting a backup: the copy on Home and in Settings
# ===========================================================================

[[scenario]]
id = "R1.1"
title = "One row on both: the delete says the cloud copy goes to the recycle bin"
area = "delete"
tags = ["semper", "holder", "home"]
accounts = ["qc-ind1"]
needs = ["emulator"]
builds = ["semper-debug-staging"]
steps = [
  "Back up an analysis (steel_00) and wait for 'Backed up'",
  "Home: long-press it, tap Delete",
  "Read the dialog, then choose From the cloud and wait past the 5 s undo",
  "Tap the row's end icon",
]
expected = "'Delete steel_00?' and 'A deleted cloud copy stays in the recycle bin for 30 days.' with From this phone, From the cloud and Everywhere. After the undo window the row stays; its end icon is a bin read 'Backup in the recycle bin'. Tapping it opens the Recycle bin, which lists steel_00"
automation = ["unitTest:DeleteChoiceDialogTest", "unitTest:SessionSelectionBinTest", "unitTest:SessionStateIconTest", "manual"]
status = "active"
since = "ADR-035"

