# ===========================================================================
# R5 Two phones, and a delete during an upload (L5-2, L5-3)
# ===========================================================================

[[scenario]]
id = "R5.1"
title = "A delete Everywhere on one phone does not come back from the other (L5-2)"
area = "two-phones"
tags = ["semper", "holder", "two-phones", "sync"]
accounts = ["qc-ind2"]
needs = ["emulator"]
builds = ["semper-debug-staging"]
steps = [
  "Phones A and B (both qc-ind2, activated, Download from my other phones on): an analysis backed up on A and restored on B, Backed up on both",
  "Phone A: Delete, Everywhere; let the 5 s pass",
  "Phone B: pull to refresh on Home; then wait for the next sync from other phones on both (or run it from WorkManager)",
]
expected = "Phone B's row shows the bin icon, 'Backup in the recycle bin'; no upload of it starts on B (staging logs: no POST /v1/sessions for its local id), and neither phone restores it. The Recycle bin on A and B lists it"
automation = ["unitTest:CloudReconcileBinTest", "unitTest:PhoneSyncTest", "pytest:backend/tests/test_recycle_bin.py::test_a_reupload_of_a_binned_analysis_is_refused"]
status = "active"
since = "ADR-035"

[[scenario]]
id = "R5.2"
title = "A backup restored from the bin is linked again on B and restored on a phone without it"
area = "two-phones"
tags = ["semper", "holder", "two-phones", "sync"]
accounts = ["qc-ind2"]
needs = ["emulator"]
builds = ["semper-debug-staging"]
steps = [
  "After R5.1: phone A opens the Recycle bin and taps Restore",
  "Phone B: pull to refresh",
  "Phone A (which has no row for it): wait for the next sync from other phones on Wi-Fi",
]
expected = "Phone B's row reads 'Backed up' again (relinked, not uploaded again). Phone A restores the analysis as a new row, as any backup from another phone"
automation = ["unitTest:CloudReconcileBinTest", "unitTest:PhoneSyncTest"]
status = "active"
since = "ADR-035"

[[scenario]]
id = "R5.3"
title = "A delete during an upload stops it, and the row is never marked backed up (L5-3)"
area = "upload"
tags = ["semper", "holder", "upload"]
accounts = ["qc-ind1"]
needs = ["emulator"]
builds = ["semper-debug-staging"]
steps = [
  "Start a backup of a large analysis (Back up now); while the row reads 'Backing up', select it and Delete From the cloud (then repeat with Everywhere on another)",
  "Let the 5 s pass; watch the row; open the Recycle bin; pull to refresh on Home",
]
expected = "The upload stops first. A cloud session it had already created is in the Recycle bin with the rest (or nothing is, if it had not got that far); the row never reads 'Backed up' afterwards, and no later check uploads it again"
automation = ["unitTest:SessionDeletesTest", "unitTest:DicUploadWorkerGuardTest", "pytest:backend/tests/test_recycle_bin.py::test_a_binned_file_refuses_completion"]
status = "active"
since = "ADR-035"

